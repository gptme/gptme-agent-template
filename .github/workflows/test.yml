name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# PRs: newer push cancels older run. master: running builds finish, queued runs collapse to newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip uv
        pip install pre-commit

    - name: Run pre-commit checks
      run: pre-commit run --all-files

  fork:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip uv
        pip install pre-commit

    - name: Setup git
      run: |
        git config --global user.email "test@example.com"
        git config --global user.name "Test User"

    - name: Test fork.sh script
      run: |
        # Test basic usage (script will do its own validation)
        ./scripts/fork.sh test-agent
        ./scripts/fork.sh test-agent-named TestAgent

    - name: Verify forked agent has no unexpected non-symlink scripts
      run: |
        # Enforce the invariant: all scripts in a forked agent must be symlinks
        # (to gptme-contrib, for auto-updating) or in the known agent-specific allowlist.
        # Catches scripts added to the template that accidentally end up in forked agents
        # without a contrib counterpart.
        python3 scripts/check-symlinks.py test-agent --mode=forked

    - name: Check template itself has no contrib copies (should be symlinks)
      run: |
        # The template itself should use symlinks for shared contrib scripts.
        python3 scripts/check-symlinks.py . --contrib-dir gptme-contrib

  gate-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Run gate tests
      run: uv run --with pytest pytest tests/test_cc_gates.py tests/test_gptme_gates.py -v

  doctor-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install gptme and tools
      run: |
        pip install "gptme[server] @ git+https://github.com/gptme/gptme.git@master"
        pip install uv pre-commit

    - name: Setup git
      run: |
        git config --global user.email "ci@example.com"
        git config --global user.name "CI Test"

    - name: Create agent from template and run doctor
      run: |
        TMPDIR=$(mktemp -d)
        # Copy workspace without .git so we can init a clean repo for fork.sh
        mkdir -p "$TMPDIR/test-agent"
        find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -not -name '.git' \
          -exec cp -r {} "$TMPDIR/test-agent/" \;
        cd "$TMPDIR/test-agent"
        git init -b master && git add -A && git commit -m "init: fork from template"
        ./scripts/fork.sh test-agent
        # cd into the forked agent (fork.sh creates it as test-agent/ within CWD)
        cd "$TMPDIR/test-agent/test-agent"
        pre-commit install
        WARNING_COUNT=$(gptme-agent doctor 2>&1 | grep -c '^  !' || true)
        echo "Doctor warnings: $WARNING_COUNT (threshold: ≤7)"
        if [ "$WARNING_COUNT" -gt 7 ]; then
          echo "Too many doctor warnings:"
          gptme-agent doctor
          exit 1
        fi

  commit-memory-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup git
      run: |
        git config --global user.email "test@example.com"
        git config --global user.name "Test User"

    - name: Run commit-memory tests
      run: bash scripts/test-commit-memory.sh

  # The README quickstart is what a new user actually runs, and it was never in
  # CI: the `fork` job exercises scripts/fork.sh directly, and `doctor-check`
  # installs gptme from git master. Both stayed green through the 2026-10-26
  # walkthrough defects (`make test` needing a preinstalled pytest, #112;
  # `create` dropping the template's [prompt] table, gptme/gptme#4498). This
  # job runs the documented sequence against *this commit's* template, so a
  # regression fails the PR instead of reaching users.
  onboarding-path:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install gptme the way the README documents
      run: |
        python -m pip install --upgrade pip pipx
        pipx install gptme
        # Deliberately the released version that `pipx install gptme` resolves
        # to. This job exists to catch what users hit; pinning it here would
        # hide release regressions behind a stale pin.
        echo "gptme: $(gptme --version)"

    - name: Expose the checked-out commit as a branch the clone can see
      run: |
        # actions/checkout leaves a detached HEAD, and `git clone --branch` needs
        # a real ref: without this, create fails with "Remote branch ... not
        # found in upstream origin". Local only, nothing is pushed.
        BRANCH="${{ github.head_ref || github.ref_name }}"
        git -C "$GITHUB_WORKSPACE" branch --force "$BRANCH" HEAD
        echo "TEMPLATE_BRANCH=$BRANCH" >> "$GITHUB_ENV"

    - name: gptme-agent create from this commit
      run: |
        gptme-agent create "$RUNNER_TEMP/my-agent" --name MyAgent \
          --template-repo "file://$GITHUB_WORKSPACE" \
          --template-branch "$TEMPLATE_BRANCH"

    - name: Doctor must not warn about prompt auto-includes or context_cmd
      run: |
        cd "$RUNNER_TEMP/my-agent"
        # doctor exits non-zero on warnings alone, so its exit code is not the
        # signal here -- these two specific absences are.
        gptme-agent doctor 2>&1 | tee "$RUNNER_TEMP/doctor.txt" || true
        cat "$RUNNER_TEMP/doctor.txt"
        fail=0
        if grep -qF "no [prompt] section" "$RUNNER_TEMP/doctor.txt"; then
          echo "::error::created workspace has no [prompt] table (auto-includes will not work)"
          fail=1
        fi
        if grep -qF "Context command: not configured" "$RUNNER_TEMP/doctor.txt"; then
          echo "::error::created workspace has no context_cmd (no dynamic context)"
          fail=1
        fi
        exit $fail

    - name: make test on the created workspace
      run: |
        cd "$RUNNER_TEMP/my-agent"
        make test
